{% load static %}<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登入 CRM</title><link rel="stylesheet" href="{% static 'app.css' %}"></head><body class="login-page"><section class="login-story"><a class="brand" href="/">tiger<span>CRM</span></a><p class="eyebrow">CUSTOMER RELATIONSHIPS, IN FOCUS</p><h1>讓每一次對話，<br>都有下一步。</h1><p>集中公司資訊、商機與追蹤工作，<br>讓團隊接得上每一段關係。</p><div class="orbit"><span>關係</span><span>行動</span><span>機會</span></div></section><section class="login-card"><p class="eyebrow">歡迎回來</p><h2>登入工作空間</h2><p class="muted">請使用你的個人員工帳號。</p>{% if needs_setup %}<div class="notice">此工作空間尚未建立第一位員工。請依啟動說明在本機完成帳號初始化。</div>{% endif %}<form method="post">{% csrf_token %}<label>登入帳號<input name="username" autocomplete="username" required autofocus></label><label>密碼<input type="password" name="password" autocomplete="current-password" required></label><div class="form-actions"><button class="primary">登入</button><button type="reset" class="button">取消</button></div><div class="feedback" role="alert">{{ error }}</div></form><small>個人帳號 · 清楚歸責 · 共同協作</small></section></body></html>
